name: Validate research dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MPLCONFIGDIR: /tmp/pathdsp-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch -c constraints-tested.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-api.txt -c constraints-tested.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_data.py
      - run: git diff --exit-code -- artifacts
