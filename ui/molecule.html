<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#081827;color:#e7f8ff;font-family:system-ui,sans-serif}section{height:360px;position:relative;overflow:hidden;border:1px solid #224456;border-radius:24px;background:radial-gradient(ellipse at 75% 50%,#123e50,transparent 65%)}canvas{width:100%;height:100%;position:absolute;inset:0}.copy{position:relative;padding:35px;width:55%;pointer-events:none}.tag{font-size:11px;letter-spacing:3px;color:#6fe5d1}h1{font-size:clamp(28px,4vw,48px);line-height:1.1;margin:20px 0 15px}p{line-height:1.6;color:#a8c3d3;font-size:14px}button{position:absolute;bottom:15px;right:18px;background:#163547;color:#cce9f4;border:1px solid #406071;border-radius:20px;padding:8px 14px;cursor:pointer}small{position:absolute;bottom:16px;left:35px;color:#91aeba;font-size:10px}@media(max-width:580px){.copy{width:75%;padding:22px}h1{font-size:30px}small{left:22px;max-width:60%}}
</style></head><body><section aria-label="Interactive illustrative molecular sculpture"><canvas aria-hidden="true"></canvas><div class="copy"><div class="tag">PATHDSP / DISCOVERY SPACE</div><h1>Small molecules.<br>Deeper insight.</h1><p>Explore the intersection of drug chemistry,<br>cancer pathways and model explanations.</p></div><small>Illustrative molecular art · not a selected drug structure</small><button aria-pressed="false">Pause motion</button></section><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('button');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,angle=0,mx=0,my=0;
const points=Array.from({length:24},(_,i)=>{let t=i*Math.PI/6;return [Math.cos(t)*(i<12?90:65),Math.sin(t)*(i<12?90:65),(i<12?-45:45)]});
const bonds=[];for(let i=0;i<24;i++){bonds.push([i,Math.floor(i/12)*12+(i+1)%12]);if(i<12)bonds.push([i,i+12])}
function label(){button.textContent=paused?'Resume motion':'Pause motion';button.setAttribute('aria-pressed',String(paused))}label();button.onclick=()=>{paused=!paused;label()};canvas.onpointermove=e=>{const r=canvas.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5};canvas.onpointerleave=()=>{mx=my=0};
let previous=0;function draw(now){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);if(!paused)angle+=Math.min((now-previous)/1000,.05)*.35;previous=now;const a=angle+(paused?0:mx*.4),b=.35+(paused?0:my*.3),scale=Math.min(r.width/650,1.2);const p=points.map(([x,y,z])=>{let xx=x*Math.cos(a)-z*Math.sin(a),zz=x*Math.sin(a)+z*Math.cos(a),yy=y*Math.cos(b)-zz*Math.sin(b);zz=y*Math.sin(b)+zz*Math.cos(b);let k=400/(400+zz)*scale;return {x:r.width*.77+xx*k,y:r.height*.48+yy*k,z:zz,k}});ctx.lineWidth=2;for(const [i,j]of bonds){ctx.strokeStyle='#417c8c';ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.stroke()}p.map((v,i)=>({...v,i})).sort((a,b)=>b.z-a.z).forEach(v=>{const radius=9*v.k,g=ctx.createRadialGradient(v.x-radius/3,v.y-radius/3,0,v.x,v.y,radius);g.addColorStop(0,'#efffff');g.addColorStop(.35,v.i%6===0?'#f1ab93':'#6ae0cc');g.addColorStop(1,'#155c70');ctx.fillStyle=g;ctx.beginPath();ctx.arc(v.x,v.y,radius,0,7);ctx.fill()});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
